[package]
name = "julian-date"
version = "1.0.1"
description = "A Tauri app that instantly converts standard calendar dates to Julian dates (and vice versa) entirely offline."
authors = ["Maite"]
edition = "2024"

[lib]
name = "julian_date_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = "0.4"
tauri = { version = "2", features = [] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
